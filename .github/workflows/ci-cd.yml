
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - "feature/**"
      - develop
      - staging
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-cd.yml"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/api/package.json') }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm install

      - name: Run ESLint
        working-directory: apps/api
        run: npm run lint

  test:
    name: Jest Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/api/package.json') }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm install

      - name: Run Jest
        working-directory: apps/api
        run: npm test

  docker-build:
    name: Build Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push Docker Image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
