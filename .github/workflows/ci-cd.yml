
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-cd.yml"

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/api/package.json') }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm install

      - name: Run ESLint
        working-directory: apps/api
        run: npm run lint

  test:
    name: Jest Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('apps/api/package.json') }}

      - name: Install dependencies
        working-directory: apps/api
        run: npm install

      - name: Run Jest
        working-directory: apps/api
        run: npm test

  docker-build:
    name: Build and Push Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Simulation)
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Staging Container
        run: |
          docker run -d \
            --name api-staging \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke Test
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:3000/health; then
              echo "Staging smoke test passed"
              docker rm -f api-staging
              exit 0
            fi
            sleep 5
          done

          docker logs api-staging
          docker rm -f api-staging
          echo "Staging smoke test failed"
          exit 1

  deploy-production:
    name: Deploy to Production (Simulation)
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull New Image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save Previous Production Image
        run: |
          if docker pull ${{ env.IMAGE_NAME }}:production-current; then
            docker tag \
              ${{ env.IMAGE_NAME }}:production-current \
              ${{ env.IMAGE_NAME }}:production-rollback
            echo "HAS_PREVIOUS=true" >> "$GITHUB_ENV"
          else
            echo "HAS_PREVIOUS=false" >> "$GITHUB_ENV"
            echo "No previous production image found"
          fi

      - name: Start Production Simulation
        run: |
          docker run -d \
            --name api-production \
            -p 3001:3000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health Check (120 Seconds)
        id: health
        continue-on-error: true
        run: |
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:3001/health; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Health check attempt $i/24"
            sleep 5
          done

          echo "Production health check failed after 120 seconds"
          exit 1

      - name: Automatic Rollback
        if: steps.health.outcome == 'failure'
        run: |
          docker rm -f api-production || true

          if [ "$HAS_PREVIOUS" = "true" ]; then
            docker run -d \
              --name api-production \
              -p 3001:3000 \
              ${{ env.IMAGE_NAME }}:production-rollback

            echo "Rollback to previous production image completed"
          else
            echo "No previous production image available for rollback"
          fi

      - name: Fail Deployment if Health Check Failed
        if: steps.health.outcome == 'failure'
        run: exit 1

      - name: Mark Production Image as Current
        if: steps.health.outcome == 'success'
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:production-current

          docker push ${{ env.IMAGE_NAME }}:production-current

      - name: Cleanup Simulation
        if: always()
        run: docker rm -f api-production || true
